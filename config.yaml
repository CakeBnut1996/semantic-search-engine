# --- SEARCH SYSTEM CONFIGURATION ---
# Solr-only architecture for both keyword and semantic search.

# [1] RETRIEVAL STRATEGY (Solr Server)
retrieval:
  # Solr Integration
  solr_url: 'http://solr:8983/solr/biokdf' # The endpoint for your Solr server.
  
  # Search parameters
  num_docs: 5                     # Number of results to return.
  
# [2] AI GENERATION SETTINGS
# Select the LLM that will summarize the Solr search results.
generation:
  active_student: 'groq_llama'

llm:
  groq_llama:
    provider: 'groq'
    model: 'meta-llama/llama-4-scout-17b-16e-instruct' # used for application
