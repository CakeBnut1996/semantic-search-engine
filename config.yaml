# --- GLOBAL SETTINGS ---
data:
  data_to_db: "data_raw" # Path to local raw data directory (adjust if connecting directly to a database)
  db_path: "chroma_db" # Path to local vector database where embeddings are saved (adjust if using a remote database)
  chunk_size: 256 # the size of each data chunk when processing the raw data
  chunk_overlap: 40 # the number of overlapping tokens between consecutive chunks

retrieval:
  num_docs: 5 # number of documents to retrieve
  chunks_per_doc: 2 # number of chunks to retrieve per document
  active_db: "demo" 
  active_embedding: "mini_lm"

generation:
  active_student: "groq_gpt_oss"

llm:
  groq_gpt_oss:
    provider: "groq"
    model: "openai/gpt-oss-120b" # Free tier on Groq
  groq_qwen:
    provider: "groq"
    model: "qwen/qwen3.8-27b" # Free tier on Groq
  gemini_flash:
    provider: "gemini"
    model: "gemini-2.5-flash" # Free tier on Google Gemini

embeddings:
  mini_lm:
    model: "sentence-transformers/all-MiniLM-L6-v2"
  gte:
    model: "thenlper/gte-small"
  bge:
    model: "BAAI/bge-small-en-v1.5"
  e5:
    model: "intfloat/e5-small-v2"
  snowflake:
    model: "Snowflake/snowflake-arctic-embed-xs"

db:
  demo:
    collection: "kdf-demo"