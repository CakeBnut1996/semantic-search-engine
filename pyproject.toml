[project]
name = "seed-search"
version = "0.2.0"
description = "SEED: Semantic Energy Exploration and Discovery Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic~=2.0",
    "python-dotenv~=1.0",
    "pyyaml~=6.0",
    "requests~=2.31",
    "fastapi~=0.109",
    "uvicorn[standard]~=0.27",
    "pysolr>=3.10",
    "openai>=1.10",
    "groq>=0.4",
]

[project.optional-dependencies]
research = [
    "beautifulsoup4",
    "matplotlib",
    "nltk",
    "pandas",
    "seaborn",
    "streamlit",
    "jupyter",
    "statsmodels",
]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
seed-api = "seed.api.server:app"
seed-cli = "seed.main:run_cli"
